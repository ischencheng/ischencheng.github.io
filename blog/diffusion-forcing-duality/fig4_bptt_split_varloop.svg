<text x="54" y="458" font-family="'PingFang SC', 'Hiragino Sans GB', 'Helvetica Neue', Arial, sans-serif" font-size="10.0" font-weight="400" fill="#18181B" text-anchor="start">• shift=1 跨 token 反馈：训练 2–6 遍、推理走 T=10⁴ 步！固定遍数会外推发散（LLLM J3 14.03→</text>
<text x="64" y="472" font-family="'PingFang SC', 'Hiragino Sans GB', 'Helvetica Neue', Arial, sans-serif" font-size="10.0" font-weight="600" fill="#0D9488" text-anchor="start">14.73；FBT 1.28× 在 400B 崩盘），必须靠截断反传或改用 LLLM 单遍仿射扫描。</text>
