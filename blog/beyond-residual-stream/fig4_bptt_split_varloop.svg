<text x="606" y="408" font-family="'Inter', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="10.6" font-weight="700" fill="#2563EB" text-anchor="start">How continuous loops compress CoT and beat extra epochs</text>
<text x="606" y="425" font-family="'Inter', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="9.6" font-weight="400" fill="#18181B" text-anchor="start">• Fewer dead ends, not steganography: solved GPQA traces shrink 3703 → 1731 → 1661,</text>
