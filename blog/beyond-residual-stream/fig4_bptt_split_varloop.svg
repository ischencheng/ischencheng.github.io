<text x="52" y="425" font-family="'Inter', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="9.6" font-weight="400" fill="#18181B" text-anchor="start">• shift=0 in-place loop (Xiong 2610.26030, ~600 runs): train &amp; test share finite K;</text>
<text x="60" y="440" font-family="'Inter', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="9.6" font-weight="400" fill="#52525B" text-anchor="start">full BPTT (2,2) beats truncated (4,1)/(8,2) (−27% params, +8% FLOPs vs non-loop).</text>
<text x="52" y="457" font-family="'Inter', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="9.6" font-weight="400" fill="#18181B" text-anchor="start">• shift=1 cross-token: train K=2–6, test T=10⁴! Fixed-K full BPTT diverges (LLLM J3</text>
